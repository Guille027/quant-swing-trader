[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsts"
version = "0.1.0"
description = "Quant Swing Trading System - research platform first, trading bot second"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas_market_calendars>=4.4",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
desktop = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
qsts = "qsts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qsts = ["ui/static/*", "ui/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
